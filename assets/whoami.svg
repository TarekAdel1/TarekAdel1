<svg width="860" height="360" viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="headerBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .code-font {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 13.5px;
      }
      .cursor {
        fill: #22d3ee;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Card Border & Background -->
  <rect x="2" y="2" width="856" height="356" rx="14" fill="url(#termBg)" stroke="url(#borderGlow)" stroke-width="1.8"/>

  <!-- Window Header -->
  <path d="M 2 16 Q 2 2 16 2 L 844 2 Q 858 2 858 16 L 858 42 L 2 42 Z" fill="url(#headerBg)"/>
  <line x1="2" y1="42" x2="858" y2="42" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#ef4444"/>
  <circle cx="44" cy="22" r="6" fill="#eab308"/>
  <circle cx="64" cy="22" r="6" fill="#22c55e"/>

  <!-- Tab Pill -->
  <rect x="90" y="10" width="165" height="24" rx="6" fill="#030712" stroke="#334155" stroke-width="1"/>
  <text x="172" y="26" class="code-font" font-size="11.5" fill="#94a3b8" text-anchor="middle">tarek_profile.py</text>

  <!-- Live Pulse Dot -->
  <circle cx="832" cy="22" r="4" fill="#22d3ee" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Code Block -->
  <g class="code-font" xml:space="preserve">
    <!-- Line numbers -->
    <text x="32" y="76" fill="#475569">01</text>
    <text x="32" y="106" fill="#475569">02</text>
    <text x="32" y="136" fill="#475569">03</text>
    <text x="32" y="166" fill="#475569">04</text>
    <text x="32" y="196" fill="#475569">05</text>
    <text x="32" y="226" fill="#475569">06</text>
    <text x="32" y="256" fill="#475569">07</text>
    <text x="32" y="286" fill="#475569">08</text>

    <!-- Code Line 1 -->
    <text x="75" y="76">
      <tspan fill="#ec4899">class</tspan> <tspan fill="#67e8f9" font-weight="700">TarekAdel</tspan><tspan fill="#cbd5e1">:</tspan>
    </text>

    <!-- Code Line 2 -->
    <text x="105" y="106">
      <tspan fill="#e2e8f0">role</tspan> <tspan fill="#38bdf8">=</tspan> <tspan fill="#a7f3d0">"AI &amp; Machine Learning Engineer"</tspan>
    </text>

    <!-- Code Line 3 -->
    <text x="105" y="136">
      <tspan fill="#e2e8f0">focus</tspan> <tspan fill="#38bdf8">=</tspan> <tspan fill="#cbd5e1">[</tspan><tspan fill="#fed7aa">"Generative AI"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#fed7aa">"Agentic AI"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#fed7aa">"Machine Learning"</tspan><tspan fill="#cbd5e1">]</tspan>
    </text>

    <!-- Code Line 4 -->
    <text x="105" y="166">
      <tspan fill="#e2e8f0">building</tspan> <tspan fill="#38bdf8">=</tspan> <tspan fill="#cbd5e1">[</tspan><tspan fill="#fed7aa">"LLM Applications"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#fed7aa">"RAG Systems"</tspan><tspan fill="#cbd5e1">, </tspan><tspan fill="#fed7aa">"AI Agents"</tspan><tspan fill="#cbd5e1">]</tspan>
    </text>

    <!-- Code Line 5 -->
    <text x="105" y="196">
      <tspan fill="#e2e8f0">language</tspan> <tspan fill="#38bdf8">=</tspan> <tspan fill="#a7f3d0">"Python"</tspan>
    </text>

    <!-- Code Line 6 (empty spacer) -->

    <!-- Code Line 7 -->
    <text x="105" y="256">
      <tspan fill="#e2e8f0">mindset</tspan> <tspan fill="#38bdf8">=</tspan> <tspan fill="#c084fc">"learn → build → ship → repeat"</tspan>
    </text>

    <!-- Code Line 8 & Blinking Cursor -->
    <text x="105" y="286">
      <tspan fill="#64748b"># shipping intelligence into production</tspan>
    </text>
    <rect x="445" y="274" width="8" height="14" class="cursor"/>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <line x1="2" y1="318" x2="858" y2="318" stroke="#1e293b" stroke-width="1.2"/>
  <text x="32" y="339" class="code-font" font-size="11" fill="#06b6d4">UTF-8</text>
  <text x="95" y="339" class="code-font" font-size="11" fill="#64748b">|</text>
  <text x="115" y="339" class="code-font" font-size="11" fill="#3b82f6">Python 3.11</text>
  <text x="215" y="339" class="code-font" font-size="11" fill="#64748b">|</text>
  <text x="235" y="339" class="code-font" font-size="11" fill="#10b981">Git: main ●</text>
  <text x="825" y="339" class="code-font" font-size="11" fill="#64748b" text-anchor="end">Ln 8, Col 42</text>
</svg>
