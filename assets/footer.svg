<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .footer-label {
        font-family: 'JetBrains Mono', monospace, sans-serif;
        font-size: 13px;
        letter-spacing: 2.5px;
        fill: #64748b;
        text-anchor: middle;
      }
      .footer-core {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 500;
        fill: #94a3b8;
        text-anchor: middle;
      }
      .stream-line {
        stroke: url(#streamGrad);
        stroke-width: 2;
        fill: none;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="240" fill="url(#footerBg)"/>

  <!-- Flowing Grid Ambient Lines -->
  <path d="M 0 60 Q 300 20 600 60 T 1200 60" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 6"/>
  <path d="M 0 100 Q 300 140 600 100 T 1200 100" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 6"/>

  <!-- Flowing Neon Energy Beam -->
  <path d="M -200 90 Q 300 150 600 90 T 1400 90" class="stream-line" filter="url(#neonGlow)">
    <animate attributeName="d" 
      values="M -200 90 Q 300 150 600 90 T 1400 90;
              M -200 110 Q 300 50 600 110 T 1400 110;
              M -200 90 Q 300 150 600 90 T 1400 90" 
      dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Center Text -->
  <text x="600" y="55" class="footer-label">// END OF TRANSMISSION</text>
  <text x="600" y="88" class="footer-core">Crafting resilient intelligence • Open to collaborations</text>

  <!-- Pulsing Network Nodes -->
  <circle cx="340" cy="50" r="3" fill="#22d3ee" filter="url(#neonGlow)">
    <animate attributeName="r" values="2;4.5;2" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="50" r="3" fill="#c084fc" filter="url(#neonGlow)">
    <animate attributeName="r" values="2;4.5;2" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Base Smooth Waves -->
  <path d="M 0 160 C 320 120, 420 200, 720 160 C 1000 120, 1120 190, 1200 160 L 1200 240 L 0 240 Z" fill="url(#waveGrad)">
    <animate attributeName="d" 
      values="M 0 160 C 320 120, 420 200, 720 160 C 1000 120, 1120 190, 1200 160 L 1200 240 L 0 240 Z;
              M 0 170 C 260 210, 520 130, 820 170 C 1020 195, 1140 140, 1200 170 L 1200 240 L 0 240 Z;
              M 0 160 C 320 120, 420 200, 720 160 C 1000 120, 1120 190, 1200 160 L 1200 240 L 0 240 Z" 
      dur="8s" repeatCount="indefinite"/>
  </path>

  <path d="M 0 185 C 280 210, 540 150, 840 185 C 1040 210, 1140 175, 1200 185 L 1200 240 L 0 240 Z" fill="#030712" opacity="0.6"/>
</svg>
