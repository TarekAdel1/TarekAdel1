<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#020617"/>
<stop offset="55%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#22d3ee"/>
<stop offset="50%" stop-color="#67e8f9"/>
<stop offset="100%" stop-color="#a78bfa"/>
</linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
<path d="M36 0H0V36" fill="none" stroke="#334155" stroke-opacity=".18"/>
</pattern>
</defs>
<rect width="1200" height="300" rx="24" fill="url(#bg)"/>
<rect width="1200" height="300" rx="24" fill="url(#grid)"/>
<ellipse cx="170" cy="70" rx="170" ry="80" fill="#06b6d4" opacity=".12" filter="url(#blur)">
  <animate attributeName="cx" values="170;300;170" dur="7s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="1030" cy="240" rx="180" ry="90" fill="#8b5cf6" opacity=".12" filter="url(#blur)">
  <animate attributeName="cx" values="1030;900;1030" dur="8s" repeatCount="indefinite"/>
</ellipse>
<g stroke="url(#glow)" stroke-width="1.2" opacity=".45">
  <path d="M880 55 L1010 105 L1100 55 L1140 160 L1010 205 L920 155 Z">
    <animate attributeName="opacity" values=".15;.6;.15" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M1010 105 L920 155 M1010 105 L1010 205 M1100 55 L1010 205"/>
</g>
<g fill="#67e8f9">
  <circle cx="880" cy="55" r="3"><animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1010" cy="105" r="4"><animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="55" r="3"/>
  <circle cx="1140" cy="160" r="4"/>
  <circle cx="1010" cy="205" r="3"/>
  <circle cx="920" cy="155" r="3"/>
</g>
<text x="72" y="105" fill="#64748b" font-family="monospace" font-size="16">$ ./initialize_ai_engineer</text>
<text x="70" y="165" fill="white" font-family="Arial, sans-serif" font-size="52" font-weight="800">
  TAREK ADEL
</text>
<rect x="72" y="188" width="430" height="3" rx="2" fill="url(#glow)">
  <animate attributeName="width" values="120;430;120" dur="4s" repeatCount="indefinite"/>
</rect>
<text x="72" y="225" fill="#cbd5e1" font-family="monospace" font-size="18">
  AI / ML  •  GenAI  •  Agentic AI
</text>
<text x="72" y="258" fill="#64748b" font-family="monospace" font-size="13">
  building intelligent systems, one commit at a time_
</text>
<circle cx="1145" cy="270" r="5" fill="#67e8f9" filter="url(#soft)">
  <animate attributeName="cy" values="270;40;270" dur="5s" repeatCount="indefinite"/>
</circle>
</svg>
