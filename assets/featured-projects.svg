<svg width="860" height="310" viewBox="0 0 860 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="projBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="nexusPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="ragPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.1"/>
    </linearGradient>

    <style>
      .proj-box {
        rx: 14px;
        fill: url(#projBg);
        stroke: #1e293b;
        stroke-width: 1.5;
      }
      .proj-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        font-weight: 700;
      }
      .proj-desc {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        fill: #94a3b8;
      }
      .tag-pill {
        rx: 5px;
        fill: #0f172a;
        stroke: #334155;
        stroke-width: 1;
      }
      .tag-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        fill: #cbd5e1;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Project 1: NEXUS -->
  <rect x="10" y="10" width="840" height="135" class="proj-box" stroke="#0e7490"/>
  <line x1="20" y1="10" x2="840" y2="10" stroke="url(#nexusPulse)" stroke-width="2.5">
    <animate attributeName="x1" values="20;700;20" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="160;840;160" dur="4s" repeatCount="indefinite"/>
  </line>

  <text x="32" y="42" class="proj-title" fill="#67e8f9">🧬 NEXUS — Agentic AI Research Assistant</text>
  <text x="32" y="70" class="proj-desc">Autonomous research assistant reasoning across complex queries, invoking live tools (Web / Wikipedia),</text>
  <text x="32" y="90" class="proj-desc">tracking dialogue state, and streaming synchronized execution traces.</text>

  <!-- Tech tags for NEXUS -->
  <g transform="translate(32, 105)">
    <rect x="0" y="0" width="60" height="22" class="tag-pill"/><text x="30" y="15" class="tag-text">Python</text>
    <rect x="68" y="0" width="80" height="22" class="tag-pill"/><text x="108" y="15" class="tag-text">LangChain</text>
    <rect x="156" y="0" width="80" height="22" class="tag-pill"/><text x="196" y="15" class="tag-text">LangGraph</text>
    <rect x="244" y="0" width="50" height="22" class="tag-pill"/><text x="269" y="15" class="tag-text">Groq</text>
    <rect x="302" y="0" width="70" height="22" class="tag-pill"/><text x="337" y="15" class="tag-text">Streamlit</text>
  </g>

  <!-- Project 2: Conversational RAG -->
  <rect x="10" y="160" width="840" height="135" class="proj-box" stroke="#6d28d9"/>
  <line x1="20" y1="160" x2="840" y2="160" stroke="url(#ragPulse)" stroke-width="2.5">
    <animate attributeName="x1" values="20;700;20" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="160;840;160" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <text x="32" y="192" class="proj-title" fill="#c084fc">📚 Conversational Multi-PDF RAG Assistant</text>
  <text x="32" y="220" class="proj-desc">Document Q&amp;A pipeline featuring semantic chunking, dynamic ChromaDB embeddings, MMR retrieval,</text>
  <text x="32" y="240" class="proj-desc">source citations with exact page numbers, and chat history retention.</text>

  <!-- Tech tags for RAG -->
  <g transform="translate(32, 255)">
    <rect x="0" y="0" width="60" height="22" class="tag-pill"/><text x="30" y="15" class="tag-text">Python</text>
    <rect x="68" y="0" width="80" height="22" class="tag-pill"/><text x="108" y="15" class="tag-text">LangChain</text>
    <rect x="156" y="0" width="78" height="22" class="tag-pill"/><text x="195" y="15" class="tag-text">ChromaDB</text>
    <rect x="242" y="0" width="50" height="22" class="tag-pill"/><text x="267" y="15" class="tag-text">Groq</text>
    <rect x="300" y="0" width="70" height="22" class="tag-pill"/><text x="335" y="15" class="tag-text">Streamlit</text>
  </g>
</svg>
